name: Heart widget native preview

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/screenshots.sh'
      - '.github/workflows/heart-preview.yml'

permissions:
  contents: read

concurrency:
  group: heart-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simulator:
    if: github.head_ref == 'feat/heart-rate-widget'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Core tests
        working-directory: ios/BlithCore
        run: swift test
      - name: Build real SwiftUI app
        working-directory: ios
        run: |
          xcodegen generate
          mkdir -p ../build
          set -o pipefail
          xcodebuild build -project Blith.xcodeproj -scheme Blith -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../build/xcodebuild.log
      - name: Capture actual Today and Heart screens
        env:
          BLITH_SCREENSHOT_FOCUS: heart
        run: bash scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heart-native-preview
          path: |
            build/screenshots/
            build/xcodebuild.log
          retention-days: 7
