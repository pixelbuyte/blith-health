<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Blith app icon — Horizon (tinted)</title>
  <defs>
    <radialGradient id="sky" cx="512" cy="500" r="600" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 500) scale(1.2 .75) translate(-512 -500)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="band" cx="512" cy="940" r="524" gradientUnits="userSpaceOnUse">
      <stop offset="0.8397" stop-color="#FFFFFF" stop-opacity="0.46"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/></radialGradient>
    <linearGradient id="arcfade" x1="0" y1="416" x2="0" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset=".34" stop-color="#fff" stop-opacity=".85"/><stop offset=".78" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#arcfade)"/></mask>
    <linearGradient id="body" x1="0" y1="500" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161616"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="500" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E6E6E6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#000000"/>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g mask="url(#fade)">
    <circle cx="512" cy="940" r="524" fill="url(#band)"/>
    <circle cx="512" cy="940" r="521" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6"/>
  </g>
  <circle cx="512" cy="940" r="440" fill="url(#body)"/>
  <g mask="url(#fade)">
    <path d="M72,940 A440,440 0 0 1 952,940 L952,996 A440,440 0 0 0 72,996 Z" fill="url(#rim)"/>
